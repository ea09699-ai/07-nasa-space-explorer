
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">

    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <section id="spaceFact" class="space-fact">
      <h2>Did You Know?</h2>
      <p id="factText">Discover something amazing about space!</p>
    </section>

    <div class="filters">
      <input type="date" id="startDate" />
      <input type="date" id="endDate" />
      <button id="getImages">Get Space Images</button>
    </div>

    <div id="loading" class="loading" hidden>
      🔄 Loading space photos...
    </div>

    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

  </div>

  <div id="imageModal" class="modal" aria-hidden="true">
    <div class="modal-content">
      <button id="closeModal" class="close-modal" aria-label="Close">&times;</button>
      <div id="modalDetails"></div>
    </div>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
